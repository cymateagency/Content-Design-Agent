<!doctype html><html lang="en"><head><meta charset="utf-8"><title>AWA glass photo poster</title>{{BASE_CSS}}</head><body>
<!-- STYLE: Glass photo (from the awa-posts format static-glass-photo). The photo does the work: full-bleed real photo,
     frosted panel at the bottom, light + bold headline, one pill. Works for TOF, MOF and BOF (swap the pill).
     SLOTS: photo (people, warm, candid; --bg or --photo) · headline (light lead-in + bold payoff, max ~9 words) · pill (2-3 words)
     With a real photo, replace the placeholder with: <img class="photo" src="{{PHOTO}}" style="inset:0;width:100%;height:100%"> -->
<div class="aw black" style="width:1080px;height:1350px">
<div class="photo-placeholder" data-edge style="inset:0">PHOTO: agency leader laughing with the team, warm light (pass --photo)</div>
{{HEADER}}
<div class="glass content" style="left:64px;right:64px;bottom:64px;height:540px;padding:72px;box-sizing:border-box">
  <div class="h-light" style="font-size:80px;line-height:1.06">Build an agency<br>people <b style="font-weight:800">don’t want<br>to leave.</b></div>
  <span class="pill pill-red" style="position:absolute;left:72px;bottom:64px">Follow for more</span>
</div>
</div></body></html>
