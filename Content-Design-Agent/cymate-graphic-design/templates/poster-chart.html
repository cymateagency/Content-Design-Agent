<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Cymate chart poster</title>{{BASE_CSS}}</head><body>
<!-- STYLE: Chart / data story (bars, lines, before/after, expectation vs reality). Clean axes, one highlighted series in the gradient, everything else muted. Values from the brief only; shapes can be illustrative when no numbers are shown. -->
<div class="cm haze-one" style="width:1080px;height:1350px">

{{HEADER}}

<div class="content" style="left:96px;right:96px;top:250px">
  <span class="kpill" style="font-size:24px">Expectation vs reality</span>
  <div class="h" style="margin-top:26px;font-size:76px">Outbound growth isn’t a <span class="grad-text">straight line.</span></div>
</div>
<div class="content" style="left:96px;right:96px;top:640px;height:440px;display:flex;gap:28px">
  <div class="glass" style="flex:1;border-radius:40px;padding:34px 34px 0;box-sizing:border-box;position:relative">
    <div style="font-weight:700;font-size:22px;letter-spacing:5px;color:rgba(255,255,255,.6)">EXPECTATION</div>
    <svg width="100%" height="320" viewBox="0 0 380 320" style="position:absolute;left:0;bottom:24px"><path d="M30 290H360M30 290V30" stroke="rgba(255,255,255,.18)" stroke-width="2"/><path d="M40 280L350 50" stroke="rgba(255,255,255,.75)" stroke-width="7" stroke-linecap="round"/></svg>
  </div>
  <div class="glass" style="flex:1;border-radius:40px;padding:34px 34px 0;box-sizing:border-box;position:relative">
    <div style="font-weight:700;font-size:22px;letter-spacing:5px;color:var(--accent)">REALITY</div>
    <svg width="100%" height="320" viewBox="0 0 380 320" style="position:absolute;left:0;bottom:24px"><defs><linearGradient id="rg" x1="0" x2="1"><stop offset="0" stop-color="#C21A00"/><stop offset=".5" stop-color="#FF5A00"/><stop offset="1" stop-color="#FFC09A"/></linearGradient></defs><path d="M30 290H360M30 290V30" stroke="rgba(255,255,255,.18)" stroke-width="2"/><path d="M40 270C70 240 80 290 110 250S150 285 175 230 215 255 235 200 280 175 300 120 335 80 350 45" fill="none" stroke="url(#rg)" stroke-width="7" stroke-linecap="round"/>
    <g font-family="Inter" font-size="15" font-weight="600" fill="rgba(255,255,255,.7)"><text x="62" y="300">test</text><text x="140" y="300">learn</text><text x="222" y="300">fix</text><text x="300" y="300">win</text></g></svg>
  </div>
</div>
{{SOCIAL_BAR}}
</div></body></html>
