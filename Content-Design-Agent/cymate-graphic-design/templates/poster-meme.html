<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Cymate meme/trend poster</title>{{BASE_CSS}}</head><body>
<!-- STYLE: Meme / trend format (red flag or green flag, POV, put a finger down, this or that, starter pack, nobody vs me). Playful display type (Luckiest Guy, Bungee, Rubik Dirt), one bold prop, a question that invites comments. Trend-specific colours (red/green flags) are allowed only inside the prop. -->
<div class="cm " style="width:1080px;height:1350px">
<div class="tx tx-dots" style="opacity:.7"></div>
{{HEADER}}

<div class="content" style="left:0;right:0;top:250px;text-align:center;font-family:'Luckiest Guy',Poppins,sans-serif;line-height:.95">
  <div style="font-size:124px;color:#FF3B2F;text-shadow:0 8px 0 rgba(0,0,0,.45)">Red flag</div>
  <div style="font-size:56px;margin:8px 0;color:rgba(255,255,255,.8)">or</div>
  <div style="font-size:124px;color:#2FD36B;text-shadow:0 8px 0 rgba(0,0,0,.45)">green flag?</div>
</div>
<div class="content glass" style="left:120px;right:120px;top:665px;height:400px;padding:52px 56px;box-sizing:border-box;transform:rotate(1.5deg);display:flex;flex-direction:column;justify-content:space-between">
  <div><div style="font-weight:700;font-size:22px;letter-spacing:5px;color:var(--accent)">THE PLAN</div>
  <div style="margin-top:16px;font-weight:700;font-size:52px;line-height:1.12">“We’ll warm up the domains after we launch.”</div></div>
  <div style="display:flex;justify-content:space-between;align-items:center">
    <div style="display:flex;gap:18px"><svg width="84" height="96" viewBox="0 0 54 62"><path d="M8 4v56" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/><path d="M10 6c10-5 18 4 28 0s12-2 12-2v26s-4-2-12 2-18-5-28 0z" fill="#FF3B2F"/></svg><svg width="84" height="96" viewBox="0 0 54 62"><path d="M8 4v56" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/><path d="M10 6c10-5 18 4 28 0s12-2 12-2v26s-4-2-12 2-18-5-28 0z" fill="#2FD36B"/></svg></div>
    <div style="font-family:Inter,Arial,sans-serif;font-size:24px;font-weight:600;color:rgba(255,255,255,.75)">Answer in the comments</div>
  </div>
</div>
{{SOCIAL_BAR}}
</div></body></html>
