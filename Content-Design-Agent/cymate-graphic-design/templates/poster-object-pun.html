<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Cymate object pun</title>{{BASE_CSS}}
<style>
/* OBJECT PUN: huge tight black type on warm off-white, finished by one realistic orange object that carries
   the punchline. Inspired by assets/inspiration/03 and 05. The object IS the last word of the line.
   Ideas: a keycap (Send, Delete, Enter, Tab, Esc), a calculator screen, a toggle switch, a price tag,
   a sticky note, a stamp, a receipt, an envelope. Keep everything else minimal. */
.big{font-family:'Archivo Black','Poppins',sans-serif;font-weight:900;color:#0A0C14;text-transform:uppercase;letter-spacing:-3px;line-height:.88;text-align:center}
.key{position:relative;width:300px;height:280px;border-radius:38px;
  background:linear-gradient(160deg,#FF9A3D 0%,#FF6A00 45%,#E04E00 100%);
  box-shadow:0 46px 70px rgba(120,40,0,.32),0 16px 26px rgba(120,40,0,.28),inset 0 -14px 0 rgba(150,45,0,.45),inset 0 4px 2px rgba(255,220,180,.6)}
.key .top{position:absolute;left:34px;right:34px;top:22px;bottom:52px;border-radius:30px;
  background:linear-gradient(170deg,#FFB061 0%,#FF7A1A 55%,#FF6A00 100%);box-shadow:inset 0 2px 1px rgba(255,235,210,.8),inset 0 -6px 14px rgba(190,60,0,.35),0 8px 14px rgba(160,50,0,.25)}
.key .lbl{position:absolute;left:30px;top:26px;font-family:Inter,Arial,sans-serif;font-size:38px;font-weight:500;color:#2A1505;letter-spacing:.5px}
</style></head><body>
<!-- Placeholder copy: replace. Line 1-3 sets up, the object lands the punchline. Keep under 8 words total. -->
<div class="cm paper" style="width:1080px;height:1350px">
<div class="tx tx-grid" style="opacity:.25;filter:invert(1)"></div>
{{HEADER}}
<div class="content" style="left:0;right:0;top:290px;display:flex;flex-direction:column;align-items:center">
  <div class="big" style="font-size:138px">Think</div>
  <div class="big" style="font-size:138px">before</div>
  <div class="big" style="font-size:138px">you hit</div>
  <div class="key" style="margin-top:-6px;transform:rotate(-4deg)"><div class="top"><div class="lbl">Send</div></div></div>
  <div style="margin-top:44px;font-family:Inter,sans-serif;font-size:30px;font-weight:500;color:#55524E;text-align:center;line-height:1.35">One relevant email beats a<br>thousand generic ones.</div>
</div>
{{SOCIAL_BAR}}
</div></body></html>
