<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Cymate photo poster</title>{{BASE_CSS}}</head><body>
<!-- STYLE: Person + glass card (Wesley). Needs --photo with a cutout PNG the user supplied (transparent background). Text sits in the glass card on the left; the photo anchors bottom-right and may overlap the card edge for depth. Wesley fronts some posts, not every one. -->
<div class="cm " style="width:1080px;height:1350px">
<div class="tx tx-grid"></div>
{{HEADER}}

<img src="{{PHOTO}}" alt="" style="position:absolute;right:-40px;bottom:0;height:820px;z-index:3;filter:drop-shadow(0 30px 50px rgba(0,0,0,.6))">
<div class="content glass" style="left:96px;width:640px;top:330px;height:560px;padding:56px;box-sizing:border-box;z-index:2">
  <span class="kpill" style="font-size:24px">List quality</span>
  <div class="h-black" style="margin-top:34px;font-size:84px">Most lists<br>are <span class="grad-text">guesses.</span></div>
  <div class="sub" style="margin-top:28px;font-size:32px;max-width:440px">Segment and validate before a single send.</div>
</div>
{{SOCIAL_BAR}}
</div></body></html>
